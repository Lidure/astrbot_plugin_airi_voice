name: Temporary v2.10 finalization

on:
  push:
    branches:
      - fix/audio-trigger-compat-v2.10.0

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Finalize v2.10 documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("Version-2.9.9-orange", "Version-2.10.0-orange")
          text = text.replace(
              "> 🔊 **v2.10.0 发送兼容性**：聊天发送统一先准备为 WAV。原 WAV 直接发送；MP3/OGG/FLAC/M4A/AMR 优先复用 AstrBot MediaResolver 转换，旧版环境回退到 ffmpeg；SILK 使用插件已有的 silk-python 解码。转换结果缓存到插件数据目录 `send_cache`，源文件变化后自动生成新缓存。",
              "> 🔊 **v2.10.0 发送兼容性**：聊天发送统一先准备为 WAV。原 WAV 直接发送；MP3/OGG/FLAC/M4A/AMR 优先复用 AstrBot MediaResolver，失败时使用插件依赖的 PyAV 自带编解码库转换，最后才尝试系统 ffmpeg；SILK 复用 silk-python 解码。转换结果缓存到插件数据目录 `send_cache`，源文件变化后自动生成新缓存。",
          )
          text = text.replace(
              "当前开发版在不变更版本号的前提下新增关键词管理：主关键词与额外关键词都能触发同一音频，额外关键词持久化在插件数据目录的 `keyword_aliases.json` 中；主关键词与所有别名全局唯一并忽略大小写。",
              "v2.10.0 延续关键词管理能力：主关键词与额外关键词都能触发同一音频，额外关键词持久化在插件数据目录的 `keyword_aliases.json` 中；主关键词与所有别名全局唯一并忽略大小写。",
          )
          readme.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          text = text.replace(
              "- 修复部分音频名称正确但平台发送失败的问题：所有聊天语音发送统一经过 WAV 兼容层，支持 AstrBot MediaResolver、ffmpeg 回退与 SILK 解码，并按源文件版本缓存转换结果。",
              "- 修复部分音频名称正确但平台发送失败的问题：所有聊天语音发送统一经过 WAV 兼容层，依次支持 AstrBot MediaResolver、PyAV 自带编解码回退、系统 ffmpeg 兜底与 SILK 解码，并按源文件版本缓存转换结果。",
          )
          dep = "### 依赖\n\n- 新增 `av>=17.1.0,<19`（PyAV），用于系统未安装 ffmpeg 时仍可将常见音频格式转换为 WAV；PyPI 提供 Linux x86_64 与 ARM64/aarch64 预编译 wheel。\n\n"
          marker = "## [2.9.9] - 2026-09-02\n"
          if dep not in text:
              if marker not in text:
                  raise SystemExit("2.9.9 changelog marker missing")
              text = text.replace(marker, dep + marker, 1)
          changelog.write_text(text, encoding="utf-8")
          PY
      - name: Commit documentation if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Documentation already finalized"
          else
            git config user.name "Lidure"
            git config user.email "101858375+Lidure@users.noreply.github.com"
            git add README.md CHANGELOG.md
            git commit -m "docs: finalize v2.10 audio compatibility notes"
            git push origin HEAD:fix/audio-trigger-compat-v2.10.0
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m py_compile main.py web_api.py voice_catalog.py request_parser.py audio_compat.py
      - name: Smoke test real built-in MP3 and SILK conversion
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import tempfile
          from pathlib import Path
          from audio_compat import AudioSendCompat

          with tempfile.TemporaryDirectory() as td:
              compat = AudioSendCompat(Path(td) / "cache")
              for source in (Path("voices/生辰快乐.mp3"), Path("voices/打卡啦摩托.silk")):
                  output = Path(asyncio.run(compat.prepare(source)))
                  data = output.read_bytes()
                  assert output.suffix == ".wav"
                  assert data[:4] == b"RIFF" and data[8:12] == b"WAVE", (source, output)
                  print(f"converted {source} -> {output.name} ({len(data)} bytes)")
          PY
      - name: Verify release contracts
        shell: bash
        run: |
          test "$(grep -c 'Record.fromFileSystem' main.py)" -eq 1
          grep -q 'return Record.fromFileSystem(prepared_path)' main.py
          grep -q 'known_keywords=self.voice_map.keys()' main.py
          grep -q 'av>=17.1.0,<19' requirements.txt
          grep -q 'version: v2.10.0' metadata.yaml
          grep -q '"2.10.0"' main.py
          grep -q 'Version-2.10.0-orange' README.md
      - run: git diff --check origin/master...HEAD
