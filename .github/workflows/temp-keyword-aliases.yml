name: Temporary keyword alias verification

on:
  push:
    branches:
      - feat/webui-keyword-aliases

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Keep reported voice counts on primary audio entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'logger.info(f"[AiriVoice] 初始化完成，共 {len(self.voice_map)} 个语音，权限模式：{self.admin_mode}，列表图片模式：{\'开启\' if self.list_as_image else \'关闭\'}")',
                  'logger.info(f"[AiriVoice] 初始化完成，共 {len(self.primary_voice_map)} 个语音，权限模式：{self.admin_mode}，列表图片模式：{\'开启\' if self.list_as_image else \'关闭\'}")',
              ),
              (
                  'yield event.plain_result(f"✅ 已重新加载，共 {len(self.voice_map)} 个语音")',
                  'yield event.plain_result(f"✅ 已重新加载，共 {len(self.primary_voice_map)} 个语音")',
              ),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"unexpected duplicate replacement target: {old!r}")
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f"neither old nor fixed form found: {old!r}")
          if changed:
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit primary voice count fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Primary voice count fix already present"
          else
            git config user.name "Lidure"
            git config user.email "101858375+Lidure@users.noreply.github.com"
            git add main.py
            git commit -m "fix: report primary audio counts with aliases"
            git push origin HEAD:feat/webui-keyword-aliases
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m py_compile main.py web_api.py voice_catalog.py request_parser.py
      - run: python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8'))"
      - name: Verify release version remains v2.9.9
        run: |
          grep -q 'version: v2.9.9' metadata.yaml
          grep -q '"2.9.9"' main.py
      - run: git diff --check origin/master...HEAD
