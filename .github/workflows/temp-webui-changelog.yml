name: Temporary WebUI bridge changelog verification

on:
  push:
    branches:
      - fix/webui-alias-post-upload-feedback

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Document WebUI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "- 列表与随机语音继续只使用主关键词，避免别名造成重复展示或改变随机权重。\n\n## [2.9.9] - 2026-09-02"
          replacement = "- 列表与随机语音继续只使用主关键词，避免别名造成重复展示或改变随机权重。\n\n### 修复\n\n- 修复 WebUI 添加额外关键词时报 `Plugin bridge endpoint is invalid.`：别名新增/删除改为固定 Plugin Pages endpoint，并通过 POST JSON body 传递参数。\n- 上传语音后在上传表单附近显示明确的成功/失败反馈；成功时展示对应主关键词并说明列表已刷新。\n\n## [2.9.9] - 2026-09-02"
          if marker in text:
              if text.count(marker) != 1:
                  raise SystemExit("unexpected changelog marker count")
              path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          elif replacement not in text:
              raise SystemExit("changelog marker not found")
          PY
      - name: Commit changelog if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Changelog already updated"
          else
            git config user.name "Lidure"
            git config user.email "101858375+Lidure@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs: note WebUI bridge and upload feedback fixes"
            git push origin HEAD:fix/webui-alias-post-upload-feedback
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m py_compile main.py web_api.py voice_catalog.py request_parser.py
      - name: Verify version remains v2.9.9
        run: |
          grep -q 'version: v2.9.9' metadata.yaml
          grep -q '"2.9.9"' main.py
      - run: git diff --check origin/master...HEAD
