name: Temporary v2.10.2 upload limit RED

on:
  push:
    branches:
      - fix/upload-limit-50mb-v2.10.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: RED contract
        run: pytest -q tests/test_upload_limit_v2102.py
