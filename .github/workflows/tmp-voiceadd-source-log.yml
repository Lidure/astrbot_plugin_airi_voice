name: tmp-voiceadd-source-log
on:
  push:
    branches:
      - fix/voiceadd-source-path-info
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip pytest
      - run: pytest -q tests/test_voice_add_source_logging.py
