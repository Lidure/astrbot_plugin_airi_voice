name: tmp-voiceadd-source-log
on:
  push:
    branches:
      - fix/voiceadd-source-path-info
permissions:
  contents: write
jobs:
  test-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voiceadd-source-path-info
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote source path log to INFO
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          old = 'logger.debug(f"[AiriVoice] 获取到本地音频路径: {local_path}")'
          new = 'logger.info(f"[AiriVoice] 获取到本地音频路径: {local_path}")'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('voice.add source-path log line not found')
          PY
      - run: python -m pip install -U pip pytest
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python -m compileall -q .
      - name: Commit source change when needed
        run: |
          if git diff --quiet -- main.py; then
            echo 'main.py already updated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'chore: expose voice.add source path at info level'
          git push origin HEAD:fix/voiceadd-source-path-info
