name: Final keyword management search verification

on:
  push:
    branches:
      - verify/webui-keyword-search-final

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m py_compile main.py web_api.py voice_catalog.py request_parser.py
      - run: python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8'))"
      - name: Verify keyword search source contract
        run: |
          grep -Fq 'id="keyword-search-input"' pages/airi-voice/index.html
          grep -Fq 'function filteredKeywordItems()' pages/airi-voice/app.js
          grep -Fq 'item.name' pages/airi-voice/app.js
          grep -Fq 'item.aliases' pages/airi-voice/app.js
          grep -Fq 'elements.keywordSearch.addEventListener("input"' pages/airi-voice/app.js
          grep -Fq '当前显示 ${visibleItems.length} / ${state.keywordItems.length} 个主关键词' pages/airi-voice/app.js
      - name: Verify version remains v2.9.9
        run: |
          grep -q 'version: v2.9.9' metadata.yaml
          grep -q '"2.9.9"' main.py
      - run: git diff --check origin/master...HEAD
