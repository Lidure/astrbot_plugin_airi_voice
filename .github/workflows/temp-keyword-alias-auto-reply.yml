name: Temporary keyword alias auto reply verification

on:
  push:
    branches:
      - feat/webui-keyword-aliases

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Let bot reply auto voice scan aliases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          old = "        for keyword in self.sorted_keys:\n"
          new = "        for keyword in sorted(self.voice_map.keys()):\n"
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one auto-reply loop, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("auto-reply keyword loop not found")
          PY
      - name: Commit alias auto reply fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Alias auto reply fix already present"
          else
            git config user.name "Lidure"
            git config user.email "101858375+Lidure@users.noreply.github.com"
            git add main.py
            git commit -m "fix: let auto reply recognize voice aliases"
            git push origin HEAD:feat/webui-keyword-aliases
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m py_compile main.py web_api.py voice_catalog.py request_parser.py
      - run: python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8'))"
      - name: Verify release version remains v2.9.9
        run: |
          grep -q 'version: v2.9.9' metadata.yaml
          grep -q '"2.9.9"' main.py
      - run: git diff --check origin/master...HEAD
