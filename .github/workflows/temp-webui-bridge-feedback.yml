name: Temporary WebUI bridge feedback verification

on:
  push:
    branches:
      - fix/webui-alias-post-upload-feedback

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_webui_bridge_feedback_regression.py
