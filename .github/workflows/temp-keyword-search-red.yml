name: Temporary keyword search regression

on:
  push:
    branches:
      - feat/webui-keyword-search

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply keyword search implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"unexpected replacement count in {path_str}: {text.count(old)}")
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
              elif new not in text:
                  raise SystemExit(f"replacement target not found in {path_str}")

          app = "pages/airi-voice/app.js"
          replace_once(
              app,
              '    keywordItems: [],\n    query: "",\n    source: "",',
              '    keywordItems: [],\n    query: "",\n    keywordQuery: "",\n    source: "",',
          )
          replace_once(
              app,
              '    keywordTable: document.getElementById("keyword-table"),\n    keywordEmpty: document.getElementById("keyword-empty-state"),\n    uploadForm: document.getElementById("upload-form"),',
              '    keywordTable: document.getElementById("keyword-table"),\n    keywordEmpty: document.getElementById("keyword-empty-state"),\n    keywordSearch: document.getElementById("keyword-search-input"),\n    uploadForm: document.getElementById("upload-form"),',
          )
          replace_once(
              app,
              '  function renderKeywords() {\n    elements.keywordList.replaceChildren();\n    elements.keywordEmpty.hidden = state.keywordItems.length !== 0;\n    elements.keywordTable.hidden = state.keywordItems.length === 0;\n\n    for (const item of state.keywordItems) {',
              '  function filteredKeywordItems() {\n    const query = state.keywordQuery.trim().toLocaleLowerCase();\n    if (!query) return state.keywordItems;\n    return state.keywordItems.filter((item) => {\n      const primary = String(item.name || "").toLocaleLowerCase();\n      const aliases = Array.isArray(item.aliases) ? item.aliases : [];\n      return primary.includes(query) || aliases.some((alias) => String(alias).toLocaleLowerCase().includes(query));\n    });\n  }\n\n  function renderKeywords() {\n    const visibleItems = filteredKeywordItems();\n    elements.keywordList.replaceChildren();\n    elements.keywordEmpty.hidden = visibleItems.length !== 0;\n    elements.keywordTable.hidden = visibleItems.length === 0;\n    const visibleAliasTotal = visibleItems.reduce(\n      (total, item) => total + (Array.isArray(item.aliases) ? item.aliases.length : 0),\n      0,\n    );\n    elements.status.textContent = `当前显示 ${visibleItems.length} / ${state.keywordItems.length} 个主关键词，${visibleAliasTotal} 个额外触发关键词。`;\n\n    for (const item of visibleItems) {',
          )
          replace_once(
              app,
              '      state.keywordItems = Array.isArray(payload && payload.items) ? payload.items : [];\n      renderKeywords();\n      const aliasTotal = state.keywordItems.reduce(\n        (total, item) => total + (Array.isArray(item.aliases) ? item.aliases.length : 0),\n        0,\n      );\n      elements.status.textContent = `共 ${state.keywordItems.length} 个主关键词，${aliasTotal} 个额外触发关键词。`;',
              '      state.keywordItems = Array.isArray(payload && payload.items) ? payload.items : [];\n      renderKeywords();',
          )
          replace_once(
              app,
              '  elements.search.addEventListener("input", () => { state.query = elements.search.value.trim(); loadVoices(); });\n  elements.source.addEventListener("change", () => { state.source = elements.source.value; loadVoices(); });',
              '  elements.search.addEventListener("input", () => { state.query = elements.search.value.trim(); loadVoices(); });\n  elements.keywordSearch.addEventListener("input", () => {\n    state.keywordQuery = elements.keywordSearch.value.trim();\n    renderKeywords();\n  });\n  elements.source.addEventListener("change", () => { state.source = elements.source.value; loadVoices(); });',
          )

          index = "pages/airi-voice/index.html"
          replace_once(
              index,
              '          </div>\n\n          <div id="keyword-empty-state" class="empty-state" hidden>\n            <h3>暂无可管理的关键词</h3>\n            <p>请先在音频管理中添加语音。</p>\n          </div>',
              '          </div>\n\n          <div class="filters keyword-filters">\n            <label>\n              搜索关键词\n              <input id="keyword-search-input" type="search" placeholder="搜索主关键词或额外关键词" autocomplete="off">\n            </label>\n          </div>\n\n          <div id="keyword-empty-state" class="empty-state" hidden>\n            <h3>没有找到匹配的关键词</h3>\n            <p>请调整搜索条件，或先在音频管理中添加语音。</p>\n          </div>',
          )
          PY
      - name: Commit implementation if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Implementation already applied"
          else
            git config user.name "Lidure"
            git config user.email "101858375+Lidure@users.noreply.github.com"
            git add pages/airi-voice/app.js pages/airi-voice/index.html
            git commit -m "feat: add keyword management search"
            git push origin HEAD:feat/webui-keyword-search
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m py_compile main.py web_api.py voice_catalog.py request_parser.py
      - run: python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8'))"
      - name: Verify version remains v2.9.9
        run: |
          grep -q 'version: v2.9.9' metadata.yaml
          grep -q '"2.9.9"' main.py
      - run: git diff --check origin/master...HEAD
