name: temporary-v2110-tests

on:
  push:
    branches:
      - feat/case-insensitive-keywords-v2.11.0

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m pytest -q > /tmp/pytest-output.txt 2>&1; echo "exit_code=$?" >> "$GITHUB_OUTPUT"; cat /tmp/pytest-output.txt
      - name: Capture failure output
        if: steps.tests.outputs.exit_code != '0'
        run: |
          cp /tmp/pytest-output.txt pytest-failure-v2110.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pytest-failure-v2110.txt
          git commit -m "ci: capture pytest failure [skip ci]"
          git push
      - name: Compile
        if: steps.tests.outputs.exit_code == '0'
        run: python -m compileall -q .
      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
