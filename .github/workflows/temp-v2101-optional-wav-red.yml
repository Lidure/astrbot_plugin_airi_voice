name: Temporary v2.10.1 optional WAV GREEN

on:
  push:
    branches:
      - fix/optional-wav-conversion-v2.10.1

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply v2.10.1 implementation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # Configuration: optional WAV conversion, default OFF.
          schema_path = Path('_conf_schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          option = {
              'description': '发送前转换为 WAV',
              'type': 'bool',
              'hint': '默认关闭：沿用旧版行为，直接以原始音频格式交给 AstrBot。开启后，发送前统一转换为 WAV 并缓存，可用于缺少 ffmpeg 或部分音频格式发送失败的环境。',
              'default': False,
          }
          if 'convert_audio_to_wav' not in schema:
              rebuilt = {}
              for key, value in schema.items():
                  rebuilt[key] = value
                  if key == 'fuzzy_keyword_match':
                      rebuilt['convert_audio_to_wav'] = option
              schema = rebuilt
          else:
              schema['convert_audio_to_wav'] = option
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Pure path selector keeps the default path identical to the caller input.
          audio_path = Path('audio_compat.py')
          audio = audio_path.read_text(encoding='utf-8')
          helper = '''\n\nasync def prepare_voice_path(\n    path: str | Path,\n    convert_audio_to_wav: bool,\n    compat: "AudioSendCompat",\n) -> str:\n    """Return the original voice path unless WAV compatibility is explicitly enabled."""\n\n    if not convert_audio_to_wav:\n        return str(path)\n    return await compat.prepare(path)\n'''
          marker = '\n\nclass AudioSendCompat:'
          if 'async def prepare_voice_path(' not in audio:
              if marker not in audio:
                  raise SystemExit('AudioSendCompat marker missing')
              audio = audio.replace(marker, helper + marker, 1)
          audio_path.write_text(audio, encoding='utf-8')

          # Main wiring.
          main_path = Path('main.py')
          main = main_path.read_text(encoding='utf-8')
          main = main.replace(
              'from .audio_compat import AudioSendCompat',
              'from .audio_compat import AudioSendCompat, prepare_voice_path',
              1,
          )
          main = main.replace(
              'from audio_compat import AudioSendCompat',
              'from audio_compat import AudioSendCompat, prepare_voice_path',
              1,
          )
          main = main.replace('    "2.10.0",\n', '    "2.10.1",\n', 1)
          init_marker = '        self.fuzzy_keyword_match = bool(self.config.get("fuzzy_keyword_match", False))\n'
          init_new = init_marker + '        self.convert_audio_to_wav = bool(self.config.get("convert_audio_to_wav", False))\n'
          if 'self.convert_audio_to_wav = bool(self.config.get("convert_audio_to_wav", False))' not in main:
              if init_marker not in main:
                  raise SystemExit('fuzzy config marker missing')
              main = main.replace(init_marker, init_new, 1)
          old_record = '''    async def _record_for_voice(self, path: str):\n        prepared_path = await self.audio_send_compat.prepare(path)\n        if prepared_path != str(Path(path).resolve()):\n            logger.debug(f"[AiriVoice] 发送前已转换为 WAV：{path} -> {prepared_path}")\n        return Record.fromFileSystem(prepared_path)\n'''
          new_record = '''    async def _record_for_voice(self, path: str):\n        prepared_path = await prepare_voice_path(\n            path,\n            self.convert_audio_to_wav,\n            self.audio_send_compat,\n        )\n        if self.convert_audio_to_wav and prepared_path != str(path):\n            logger.debug(f"[AiriVoice] 发送前已转换为 WAV：{path} -> {prepared_path}")\n        return Record.fromFileSystem(prepared_path)\n'''
          if new_record not in main:
              if old_record not in main:
                  raise SystemExit('_record_for_voice block missing')
              main = main.replace(old_record, new_record, 1)
          main_path.write_text(main, encoding='utf-8')

          # Release metadata.
          metadata_path = Path('metadata.yaml')
          metadata = metadata_path.read_text(encoding='utf-8').replace('version: v2.10.0', 'version: v2.10.1', 1)
          metadata_path.write_text(metadata, encoding='utf-8')

          # Existing release assertions track the current plugin release.
          for test_name in ('tests/test_audio_trigger_compat_v210.py', 'tests/test_keyword_aliases.py'):
              path = Path(test_name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('version: v2.10.0', 'version: v2.10.1')
              text = text.replace("'\"2.10.0\"'", "'\"2.10.1\"'")
              text = text.replace('test_release_version_is_v2_10_0', 'test_audio_compat_feature_is_in_v2_10_1_release')
              text = text.replace('test_keyword_alias_feature_is_in_v210_release', 'test_keyword_alias_feature_is_in_v2101_release')
              path.write_text(text, encoding='utf-8')

          # README and changelog.
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('Version-2.10.0-orange', 'Version-2.10.1-orange', 1)
          old_note = '> 🔊 **v2.10.0 发送兼容性**：聊天发送统一先准备为 WAV。原 WAV 直接发送；MP3/OGG/FLAC/M4A/AMR 优先复用 AstrBot MediaResolver，失败时使用插件依赖的 PyAV 自带编解码库转换，最后才尝试系统 ffmpeg；SILK 复用 silk-python 解码。转换结果缓存到插件数据目录 `send_cache`，源文件变化后自动生成新缓存。'
          new_note = '> 🔊 **v2.10.1 可选 WAV 兼容**：新增 `convert_audio_to_wav`（发送前转换为 WAV），默认关闭。关闭时按旧版方式直接发送原始音频；只有开启后才会使用 WAV 兼容层（AstrBot MediaResolver → PyAV → 系统 ffmpeg，SILK 使用 silk-python），并缓存到 `send_cache`。遇到 Windows/精简环境提示 `ffmpeg not found` 或部分音频发送失败时再开启即可。'
          if old_note in readme:
              readme = readme.replace(old_note, new_note, 1)
          elif new_note not in readme:
              raise SystemExit('README audio compatibility note missing')
          readme = readme.replace('WebUI 音频与关键词管理（v2.10.0）', 'WebUI 音频与关键词管理（v2.10.1）', 1)
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '''## [2.10.1] - 2026-09-02\n\n### 变更\n\n- 新增 `convert_audio_to_wav`（发送前转换为 WAV）配置，默认关闭。关闭时恢复旧版原始格式直发行为；开启时才使用 v2.10.0 引入的 WAV 兼容层与 `send_cache` 缓存。\n- 保留 WAV 兼容层作为针对 `ffmpeg not found`、部分非 WAV 音频发送失败等环境问题的可选兼容方案。\n\n'''
          if '## [2.10.1] - 2026-09-02' not in changelog:
              marker = '## [Unreleased]\n\n'
              if marker not in changelog:
                  raise SystemExit('CHANGELOG Unreleased marker missing')
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Implementation already applied"
          else
            git config user.name "Lidure"
            git config user.email "101858375+Lidure@users.noreply.github.com"
            git add _conf_schema.json audio_compat.py main.py metadata.yaml README.md CHANGELOG.md tests/test_audio_trigger_compat_v210.py tests/test_keyword_aliases.py
            git commit -m "fix: make WAV conversion opt-in"
            git push origin HEAD:fix/optional-wav-conversion-v2.10.1
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Full regression suite
        run: pytest -q
      - name: Compile and validate config
        run: |
          python -m py_compile main.py web_api.py voice_catalog.py request_parser.py audio_compat.py
          python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8'))"
      - name: Verify optional conversion contracts
        shell: bash
        run: |
          grep -q '"convert_audio_to_wav"' _conf_schema.json
          grep -q 'self.convert_audio_to_wav = bool(self.config.get("convert_audio_to_wav", False))' main.py
          grep -q 'version: v2.10.1' metadata.yaml
          grep -q '"2.10.1"' main.py
          grep -q 'Version-2.10.1-orange' README.md
      - run: git diff --check origin/master...HEAD
