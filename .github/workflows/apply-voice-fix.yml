name: Apply voice release docs

on:
  push:
    branches:
      - verify/apply-voice-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voice-duplicate-webui-builtin
          fetch-depth: 0
      - name: Apply bounded release changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {actual}")
              target.write_text(text.replace(old, new, expected), encoding="utf-8")

          replace("main.py", '    "2.9.7",\n', '    "2.9.8",\n')
          replace("metadata.yaml", "version: v2.9.7", "version: v2.9.8")

          replace(
              "README.md",
              "Version-2.9.7-orange",
              "Version-2.9.8-orange",
          )
          replace(
              "README.md",
              "## 🖥️ WebUI 语音管理（v2.9.2）",
              "## 🖥️ WebUI 语音管理（v2.9.8）",
          )
          replace(
              "README.md",
              "Version 2.9.1 adds a shared audio player with pause, seek, and close controls. Starting another preview automatically switches the player to the new voice, while the refreshed visual layout keeps playback status and voice management easy to follow. The page also supports bridge-compatible voice deletion and bottom-fixed playback/error feedback.",
              "v2.9.8 修复了 `/随机...` 被多个 AstrBot 处理器同时接收时重复发送语音的问题；WebUI 现在允许有权限的管理员删除插件内置 `voices/` 语音，并会在试听 `.silk` 时自动解码为浏览器可播放的 WAV。普通 MP3/WAV/OGG 等格式继续直接预览。",
          )
          replace(
              "README.md",
              "4. 需要时删除自己添加或网页上传的语音，或点击重载刷新目录。",
              "4. 需要时可删除插件内置、聊天添加或网页上传的语音；配置文件池中指向外部位置的文件仍保持只读。也可点击重载刷新目录。",
          )
          replace(
              "README.md",
              "- 内置 `voices/` 语音为只读，不能从页面删除；页面只能删除用户添加或网页上传的语音。",
              "- 有权限的管理员可以从 WebUI 删除内置 `voices/`、用户添加和网页上传的语音；`extra_voice_pool` 中由配置直接引用的外部文件保持只读，避免误删配置源。",
          )
          replace(
              "README.md",
              "> 💡 如果引用的是 QQ 的 `.silk` 语音，插件会尝试先用 `silk/decoder` 解码成 PCM，再交给 `ffmpeg` 转成无损 `WAV` 保存。你也可以在插件配置里填写 `silk_decoder_path`。",
              "> 💡 `.silk` 文件会作为语音文件正常保存；从 WebUI 试听时，v2.9.8 起会通过 `silk-python` 在插件侧解码并封装为 WAV，因此浏览器无需原生支持 QQ/Tencent Silk。",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "---\n\n## [2.9.7] - 2026-08-04"
          if text.count(marker) != 1:
              raise SystemExit("CHANGELOG.md: release insertion marker mismatch")
          release = """---\n\n## [2.9.8] - 2026-08-26\n\n### 修复\n\n- 修复 `/随机...` 同一消息被多个 AstrBot 处理器同时命中时一次返回两条语音的问题；同一事件现在只允许一个随机语音处理器完成发送。\n- WebUI 允许有管理权限的用户删除插件内置 `voices/` 音频，同时继续保护由配置直接引用的外部语音文件。\n- 修复 `.silk`（例如内置“打卡啦摩托”）无法在 WebUI 试听的问题：服务端使用 `silk-python` 解码为 24 kHz 单声道 WAV 后再交给浏览器播放。\n\n### 依赖\n\n- 新增 `silk-python>=0.2.8`，用于跨平台 Silk 试听解码。\n\n## [2.9.7] - 2026-08-04"""
          changelog.write_text(text.replace(marker, release, 1), encoding="utf-8")
          PY
      - name: Commit release changes
        shell: bash
        run: |
          git config user.name "Lidure"
          git config user.email "101858375+Lidure@users.noreply.github.com"
          git add main.py metadata.yaml README.md CHANGELOG.md
          git commit -m "docs: release v2.9.8"
          git push origin HEAD:fix/voice-duplicate-webui-builtin
