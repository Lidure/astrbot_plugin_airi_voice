name: Final v2.10.2 upload-limit reverification

on:
  push:
    branches:
      - verify/upload-limit-50mb-v2102-final2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Full regression suite
        run: pytest -q
      - name: Validate final formal head
        shell: bash
        run: |
          python -m py_compile main.py web_api.py voice_catalog.py request_parser.py audio_compat.py
          python - <<'PY'
          from voice_catalog import MAX_UPLOAD_BYTES
          assert MAX_UPLOAD_BYTES == 50 * 1024 * 1024
          print(f'max_upload_bytes={MAX_UPLOAD_BYTES}')
          PY
          grep -q 'upload exceeds 50 MB' voice_catalog.py
          grep -q 'version: v2.10.2' metadata.yaml
          grep -q '"2.10.2"' main.py
          grep -q 'test_audio_compat_feature_is_in_v2_10_2_release' tests/test_audio_trigger_compat_v210.py
          grep -q 'test_release_version_is_v2_10_2' tests/test_optional_wav_conversion_v2101.py
          grep -q 'test_keyword_alias_feature_is_in_v2102_release' tests/test_keyword_aliases.py
          test ! -e .github/workflows/temp-v2102-upload-limit-red.yml
          test ! -e .github/workflows/helper-v2102-rename-tests.yml
          git diff --check origin/master...fb693e8452dd31b50432d962ae79ca44c1574d7e
