name: Temporary fuzzy trigger regression

on:
  push:
    branches:
      - feat/fuzzy-keyword-trigger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_fuzzy_keyword_trigger.py
