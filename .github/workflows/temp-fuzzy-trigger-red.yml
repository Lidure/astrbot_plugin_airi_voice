name: Temporary fuzzy trigger regression

on:
  push:
    branches:
      - feat/fuzzy-keyword-trigger

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Document fuzzy keyword trigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          marker = "> ⚠️ 未选择 LLM 模式时，插件只作为普通语音关键词插件工作，大模型不会看到 `airi_*` 工具。"
          note = "> 💡 可在插件配置中开启 `fuzzy_keyword_match`（模糊匹配）。开启后，用户消息只要包含主关键词或额外关键词即可触发；整句精确匹配优先，否则选择命中的最长关键词。Prefix 模式仍要求 `#voice` 前缀，LLM 模式不受该开关影响。默认关闭。"
          if note not in text:
              if marker not in text:
                  raise SystemExit("README trigger-mode marker not found")
              readme.write_text(text.replace(marker, note + "\n\n" + marker, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = "- 新增可选的 `fuzzy_keyword_match`（模糊匹配）配置：开启后用户消息包含任意主关键词或额外关键词即可触发；精确匹配优先，否则选择最长命中关键词；Prefix/LLM/随机语音边界保持不变。"
          if entry not in text:
              marker = "### 新增\n\n"
              if marker not in text:
                  raise SystemExit("CHANGELOG Unreleased marker not found")
              changelog.write_text(text.replace(marker, marker + entry + "\n", 1), encoding="utf-8")
          PY
      - name: Commit documentation if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Documentation already applied"
          else
            git config user.name "Lidure"
            git config user.email "101858375+Lidure@users.noreply.github.com"
            git add README.md CHANGELOG.md
            git commit -m "docs: document fuzzy keyword trigger"
            git push origin HEAD:feat/fuzzy-keyword-trigger
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m py_compile main.py web_api.py voice_catalog.py request_parser.py
      - run: python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8'))"
      - name: Verify fuzzy trigger contract
        run: |
          grep -q '"fuzzy_keyword_match"' _conf_schema.json
          grep -q 'def match_trigger_keyword' request_parser.py
          grep -q 'self.fuzzy_keyword_match' main.py
      - name: Verify version remains v2.9.9
        run: |
          grep -q 'version: v2.9.9' metadata.yaml
          grep -q '"2.9.9"' main.py
      - run: git diff --check origin/master...HEAD
